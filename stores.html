  }

  a{color:inherit;text-decoration:none}
  .wrap{max-width:880px;margin:0 auto;padding:0 10px 30px}

  header{padding:22px 0 10px;text-align:center}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--green-dark)}
  .brand b{color:var(--green)}
  h1{margin-top:4px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .guide{margin:10px auto 0;max-width:480px;background:var(--green-soft);border-radius:10px;
    padding:10px 12px;font-size:13px;line-height:1.6;color:var(--green-dark);font-weight:600}

  .bar{display:flex;gap:6px;align-items:center;margin:12px 0 8px}
  .bar input{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:8px 11px;
    border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;color:var(--ink)}
  .bar input:focus{border-color:var(--green)}
  .toggle{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .toggle.on{background:var(--green);border-color:var(--green);color:#fff}
  .count{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap}

  /* 5열 촘촘 그리드 */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--tile);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tile{aspect-ratio:1/1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:9px;display:flex;flex-direction:column;background:var(--tile);transition:background .12s}
  .tile:hover{background:var(--green-soft)}
  .tile.off{background:var(--tile-off)}
  .tile.off:hover{background:var(--tile-off)}
  .slot{align-self:flex-start;font-size:10px;font-weight:800;color:var(--green);
    background:var(--green-soft);padding:2px 5px;border-radius:4px;margin-bottom:5px}
  .tile.off .slot{color:#9AA394;background:#EFEEE4}
  .name{font-size:12.8px;font-weight:800;line-height:1.3;letter-spacing:-.03em;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile.off .name{color:#8A9384}
  .sp{flex:1;min-height:4px}
  .sns{display:flex;flex-wrap:wrap;gap:4px}
  .sns a{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
    border-radius:8px;background:var(--green);color:#fff}
  .sns a:hover{background:var(--green-dark)}
  .sns a.ghost{background:#fff;color:var(--green-dark);border:1px solid var(--line)}
  .sns a.ghost:hover{background:var(--green-soft);border-color:var(--green)}
  .sns a.named{width:auto;height:auto;min-height:28px;padding:4px 6px;font-size:10px;
    font-weight:800;line-height:1.25;text-align:center;letter-spacing:-.03em}
  .none{font-size:10.5px;font-weight:700;color:#A7AF9F;border:1px dashed #D6D4C4;
    border-radius:7px;padding:5px 6px;text-align:center}

  .empty{padding:36px 0;text-align:center;color:var(--ink-soft);font-size:13.5px}
  footer{margin-top:16px;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.7}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(3,1fr)}
    h1{font-size:19px}
    .tile{padding:8px}
    .name{font-size:12px}
  }
  @media (max-width:360px){ .grid{grid-template-columns:repeat(2,1fr)} }
</style>

  });
  const withSns=list.filter(x=>x.l.length).length;
  countEl.textContent=`${list.length}곳 · SNS ${withSns}`;
  emptyEl.style.display=list.length?'none':'block';
  grid.style.display=list.length?'grid':'none';
  grid.innerHTML=list.map(x=>`
    <div class="tile${x.l.length?'':' off'}">
      <span class="slot">${x.s.join(' · ')}</span>
      <div class="name">${x.n}</div>
      <div class="sp"></div>
      ${x.l.length
        ? `<div class="sns">${x.l.map((v,i)=>{
            const tag=v[2]||'';
            const title=tag||LABEL[v[0]];
            const cls=[v[0]==='ig'&&i===0?'':'ghost', tag?'named':''].filter(Boolean).join(' ');
            return `<a class="${cls}" href="${v[1]}" target="_blank" rel="noopener" title="${title}" aria-label="${x.n} ${title}">${tag||ICON[v[0]]}</a>`;
          }).join('')}</div>`
        : `<div class="none">SNS 미등록</div>`}
    </div>`).join('');
}
document.getElementById('q').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});
document.getElementById('onlySns').addEventListener('click',e=>{only=!only;e.target.classList.toggle('on',only);render();});
render();
</script>
</body>
</html>
