<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>점주 인스타 맞팔 지원 — 비북스</title>
<meta name="description" content="비북스 0.1평 점주 인스타그램 맞팔 지원. 동·호수와 서점명을 눌러 바로 방문하세요."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #1a4a2e;
  --navy2: #255c3a;
  --accent: #3aaa6a;
  --bg: #f5f7f3;
  --white: #ffffff;
  --text: #1c2b22;
  --muted: #6b7c72;
  --border: #dce5de;
  --shadow: 0 4px 24px rgba(26, 74, 46, 0.08);
  --instagram: #c13584;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }

.hero {
  background: var(--navy);
  color: var(--white);
  padding: 48px 24px 40px;
  text-align: center;
}

.hero-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}

.hero h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(1.7rem, 5vw, 2.4rem);
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 12px;
}

.hero p {
  max-width: 480px;
  margin: 0 auto;
  color: rgba(255, 255, 255, 0.7);
  font-size: 0.95rem;
  font-weight: 300;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(245, 247, 243, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
}

.toolbar input {
  width: min(100%, 360px);
  padding: 11px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  background: var(--white);
  font: inherit;
  font-size: 0.9rem;
  color: var(--text);
}

.toolbar input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(58, 170, 106, 0.15);
}

.stat {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 16px 80px;
}

.guide {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 22px;
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.7;
}

.guide strong { color: var(--navy); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 12px;
}

.cell {
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 10px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: var(--white);
  box-shadow: var(--shadow);
  text-align: center;
  transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s, background 0.18s;
  cursor: pointer;
  min-height: 0;
}

.cell:hover,
.cell:focus-visible {
  outline: none;
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 10px 28px rgba(26, 74, 46, 0.14);
  background: #f0faf4;
}

.cell-loc {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(0.95rem, 2.8vw, 1.15rem);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.02em;
  line-height: 1.1;
}

.cell-store {
  font-size: clamp(0.72rem, 2.2vw, 0.84rem);
  font-weight: 700;
  color: var(--navy);
  line-height: 1.35;
  word-break: keep-all;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}

.cell-ig {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--instagram);
  letter-spacing: 0.04em;
  margin-top: 2px;
}

.loading,
.empty,
.error {
  text-align: center;
  padding: 64px 20px;
  color: var(--muted);
  font-size: 0.95rem;
}

.spinner {
  display: inline-block;
  width: 28px;
  height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.footer {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 0.75rem;
}

.footer a {
  color: var(--accent);
  font-weight: 700;
}

@media (min-width: 640px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 14px;
  }
}

@media (min-width: 900px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .hero { padding: 64px 40px 52px; }
  .wrap { padding: 36px 28px 100px; }
}
</style>
</head>
<body>

<header class="hero">
  <p class="hero-label">For Store Owners</p>
  <h1>점주 인스타 맞팔 지원</h1>
  <p>동·호수와 서점명을 눌러 인스타그램으로 바로 이동하세요.<br/>서로 방문하고 맞팔하며 비북스 네트워크를 키워가요.</p>
</header>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="서점명 · 동호수 검색" autocomplete="off"/>
  <span class="stat" id="statBadge">불러오는 중...</span>
</div>

<main class="wrap">
  <div class="guide">
    <strong>이용 안내</strong> · 입점 시트의 <strong>홍보 채널</strong>에 인스타그램이 있는 서점만 표시됩니다.
    칸을 누르면 해당 서점 인스타로 바로 이동합니다.
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div><br/>점주 인스타 불러오는 중...
  </div>
  <div id="empty" class="empty" hidden>검색 결과가 없어요.</div>
  <div id="error" class="error" hidden></div>
  <div class="grid" id="grid" hidden></div>
</main>

<footer class="footer">
  <a href="./index.html">← 비북스 홈</a>
  · © 2026 b.books
</footer>

<script>
const SHEET_ID = '1F52A9d0aBitMNrn_yWqAPCzpBDqnMkSIrcBrer15VvQ';
const SHEET_GID = '2070882892';
const COL_LOC = 0;
const COL_STORE = 1;
const COL_CHANNEL = 10;

let allStores = [];

function cellValue(row, index) {
  const cell = row.c && row.c[index];
  if (!cell) return '';
  return String(cell.f || cell.v || '').trim();
}

function firstInstagram(raw) {
  if (!raw || raw === '-' || raw === '상동') return '';
  const text = String(raw).replace(/\u00a0/g, ' ');
  const urlMatch = text.match(/https?:\/\/(?:www\.)?instagram\.com\/[A-Za-z0-9._]+(?:\/[^\s]*)?/i)
    || text.match(/(?:^|[\s,;])((?:www\.)?instagram\.com\/[A-Za-z0-9._]+)/i);
  if (urlMatch) {
    let url = urlMatch[0].trim().replace(/^[\s,;]+/, '');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url.replace(/[),.;]+$/, '');
  }
  const atMatch = text.match(/@([A-Za-z0-9._]{2,})/);
  if (atMatch) return 'https://www.instagram.com/' + atMatch[1];
  return '';
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function applySheet(res) {
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  try {
    if (!res || res.status !== 'ok' || !res.table || !res.table.rows) {
      throw new Error('시트 응답 오류');
    }
    allStores = res.table.rows
      .map(row => ({
        loc: cellValue(row, COL_LOC).replace(/\s+/g, ''),
        store: cellValue(row, COL_STORE).replace(/\n/g, ' ').trim(),
        instagram: firstInstagram(cellValue(row, COL_CHANNEL))
      }))
      .filter(row => /^[A-C]-\d+$/i.test(row.loc) && row.store && row.instagram)
      .sort((a, b) => a.loc.localeCompare(b.loc, 'ko', { numeric: true }));

    document.getElementById('statBadge').textContent = `인스타 ${allStores.length}곳`;
    loading.hidden = true;
    render();
  } catch (e) {
    loading.hidden = true;
    error.hidden = false;
    error.textContent = '데이터를 불러오지 못했어요. 잠시 후 다시 열어주세요.';
    document.getElementById('statBadge').textContent = '로드 실패';
  }
}

function loadData() {
  window.__bbooksStores = applySheet;
  const script = document.createElement('script');
  script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:json;responseHandler=__bbooksStores&gid=' + SHEET_GID + '&headers=1';
  script.onerror = function () {
    applySheet(null);
  };
  document.body.appendChild(script);
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const filtered = allStores.filter(row => {
    if (!q) return true;
    return [row.loc, row.store].join(' ').toLowerCase().includes(q);
  });

  if (!filtered.length) {
    grid.hidden = true;
    empty.hidden = false;
    return;
  }

  empty.hidden = true;
  grid.hidden = false;
  grid.innerHTML = filtered.map(row => `
    <a class="cell"
       href="${escapeHtml(row.instagram)}"
       target="_blank"
       rel="noopener"
       title="${escapeHtml(row.store)} 인스타그램">
      <span class="cell-loc">${escapeHtml(row.loc || '–')}</span>
      <span class="cell-store">${escapeHtml(row.store)}</span>
      <span class="cell-ig">Instagram</span>
    </a>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', render);
loadData();
</script>
</body>
</html>
